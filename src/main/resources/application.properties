# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── H2 Database (file mode — data persists between restarts) ─────────────────
# The database file will be saved at ~/booknook-db
spring.datasource.url=jdbc:h2:file:./data/booknook-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─── H2 Console (visit http://localhost:8080/h2-console to browse the DB) ─────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
# create-drop: recreate tables on every startup (great for development)
# Change to "update" if you want data to survive restarts
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 dialect — tells Hibernate to use H2-compatible SQL
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ─── Jackson (JSON serializer) ────────────────────────────────────────────────
# Format dates as ISO strings, not timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.booknook=INFO
logging.level.org.springframework.web=WARN
